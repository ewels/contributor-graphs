[package]
name = "contributor-graphs"
version = "1.3.0"
edition = "2021"
rust-version = "1.87"
description = "Generate contributor timeline graphs (static SVG + interactive HTML) for any git or GitHub repository"
license = "Apache-2.0"
repository = "https://github.com/ewels/contributor-graphs"
homepage = "https://ewels.github.io/contributor-graphs/"
keywords = ["git", "github", "contributors", "visualization", "timeline"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
# Keep the published crate lean — ship the source, not the docs site or CI.
exclude = ["/docs", "/.github", "/.claude", "/Dockerfile", "/.dockerignore", "/prek.toml", "/.prettierignore"]

[[bin]]
name = "contributor-graphs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
strip = true

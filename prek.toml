# Pre-commit hooks, run with `prek` (https://prek.j178.dev).
#   prek install        # set up the git hook
#   prek run --all-files

# Generated showcase assets and lockfiles: never reformat or whitespace-fix
# (they are produced verbatim by the binary, including by CI, which does not run
# these hooks — fixing them here would cause churn).
exclude = '''(?x)(
  ^docs/(rnaseq|rnaseq-wikipedia|nf-core|sarek)\.html$ |
  ^docs/(example-[^/]*|nf-core|sarek)\.svg$ |
  ^Cargo\.lock$
)'''

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --"
files = '\.rs$'

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets -- -D warnings"
files = '\.rs$'
pass_filenames = false

[[repos.hooks]]
id = "prettier"
name = "prettier"
language = "node"
additional_dependencies = ["prettier@3.6.2"]
entry = "prettier --write"
files = '\.(css|html|js|json|md|ya?ml)$'

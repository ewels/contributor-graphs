name: Release

# Builds binaries for each platform and attaches them to the GitHub Release,
# then publishes the crate to crates.io (if CARGO_REGISTRY_TOKEN is set).
# Trigger by publishing a release whose tag is the version, e.g. v0.1.0.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload binaries to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # macos-13 (Intel) runners are deprecated and no longer get
          # allocated, which stalled the whole release; cross-compile the
          # x86_64 macOS binary on the Apple Silicon runner instead.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache here: a poisoned cache could end up in released
      # binaries, and release builds should be clean anyway (zizmor
      # cache-poisoning).

      - name: Install cross-linker (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bin=contributor-graphs
          name="$bin-$TAG-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "./target/${{ matrix.target }}/release/$bin.exe" ./README.md ./LICENSE
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" "$bin" -C "$GITHUB_WORKSPACE" README.md LICENSE
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ env.ASSET }}

  crates:
    name: Publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    # Runs in the `release` environment; the crates.io Trusted Publishing
    # config must list this same environment name (see README → Releasing).
    environment: release
    # Trusted Publishing: mint a short-lived token via OIDC, no stored secrets.
    # Requires a one-time setup on crates.io (see README → Releasing).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # Skip if this version is already on crates.io (e.g. the first release,
      # which is published manually). Checked before auth so it doesn't fail
      # when Trusted Publishing isn't configured yet.
      - id: check
        run: |
          pkg=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].name')
          ver=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          if curl -sf "https://crates.io/api/v1/crates/$pkg/$ver" >/dev/null 2>&1; then
            echo "$pkg $ver is already on crates.io — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - if: steps.check.outputs.skip != 'true'
        name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
